<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Ablauf: Wal-Einzahlung auf Binance bis Short auf Bitget"><title>Ablauf: Wal-Einzahlung auf Binance bis Short auf Bitget</title><rect x="0.5" y="0.5" width="899" height="261" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="28.0" y="40.0" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="start">So entsteht das Signal</text><text x="28.0" y="62.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start">Die Einzahlung ist on-chain sichtbar, bevor Binance sie gutschreibt</text><rect x="28" y="92" width="180" height="92" rx="10" fill="#f4f3f0" stroke="rgba(11,11,11,0.10)"/><text x="118.0" y="126.0" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="middle">Wal</text><text x="118.0" y="148.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">schickt ≥ 500k $</text><text x="118.0" y="166.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">eines Altcoins</text><line x1="216" y1="138.0" x2="244" y2="138.0" stroke="#898781" stroke-width="2"/><path d="M244,133.0 l8,5 l-8,5 z" fill="#898781"/><rect x="252" y="92" width="180" height="92" rx="10" fill="#f4f3f0" stroke="rgba(11,11,11,0.10)"/><text x="342.0" y="126.0" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="middle">Binance-</text><text x="342.0" y="148.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Einzahladresse</text><text x="342.0" y="166.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">on-chain sichtbar</text><line x1="440" y1="138.0" x2="468" y2="138.0" stroke="#898781" stroke-width="2"/><path d="M468,133.0 l8,5 l-8,5 z" fill="#898781"/><rect x="476" y="92" width="180" height="92" rx="10" fill="#f4f3f0" stroke="rgba(11,11,11,0.10)"/><text x="566.0" y="126.0" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="middle">Binance</text><text x="566.0" y="148.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">schreibt gut</text><text x="566.0" y="166.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">nach ~1–5 min</text><line x1="664" y1="138.0" x2="692" y2="138.0" stroke="#898781" stroke-width="2"/><path d="M692,133.0 l8,5 l-8,5 z" fill="#898781"/><rect x="700" y="92" width="180" height="92" rx="10" fill="#f4f3f0" stroke="rgba(11,11,11,0.10)"/><text x="790.0" y="126.0" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="middle">Verkauf</text><text x="790.0" y="148.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Kurs gerät</text><text x="790.0" y="166.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">unter Druck</text><path d="M342.0,188 V224 H590" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/><circle cx="342.0" cy="188" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><rect x="590" y="202" width="290" height="46" rx="10" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5"/><text x="735.0" y="221.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">KBot: Short auf Bitget</text><text x="735.0" y="239.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">Einstieg nach 1–2 min · Ausstieg nach 60 min</text><text x="354.0" y="218.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">KBot liest jeden Block mit</text></svg>